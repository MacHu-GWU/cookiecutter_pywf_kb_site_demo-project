# The docs part of a site's mise.toml: merge these [env], [tools] and [tasks]
# entries into the project's own file. `inst` (uv sync) is the project's
# usual install task. mise.toml is the single source of truth for the site's
# values (KB_DOMAIN, KB_SUBDOMAIN); `mise run setup-cloudflare-secrets` copies
# them to GitHub Actions variables, since CI runs without mise
# (references/gotchas.md#no-mise-in-ci).

[env]
# Local port of `mise run view-doc` (and of an editor's preview config): an
# uncommon one, so it never fights with other dev servers.
KB_DOCS_PORT = "48761"
# Cloudflare account and Pages upload token, read from the local secret store.
# An exported value (a GitHub Actions secret) wins. Each line names its own
# variable twice (references/gotchas.md#secret-template-names).
CLOUDFLARE_ACCOUNT_ID = "{{ env.CLOUDFLARE_ACCOUNT_ID | default(value=exec(command='<print the account id> || true')) }}"
CLOUDFLARE_API_TOKEN = "{{ env.CLOUDFLARE_API_TOKEN | default(value=exec(command='<print the token> || true')) }}"
# The site lives at https://<KB_SUBDOMAIN>.<KB_DOMAIN>; the scripts build that
# URL (conf.py, build-doc.sh), and KB_SUBDOMAIN also names the Cloudflare Pages
# project (deploy-doc.sh). KB_DOMAIN is a zone on Cloudflare, in the account
# above; "pages.dev" means no custom domain (https://<KB_SUBDOMAIN>.pages.dev).
KB_DOMAIN = "example.com"
KB_SUBDOMAIN = "my-kb"
# The skill's stdlib-only scripts, called in place (build-doc.sh has the same default).
KB_SCRIPTS = ".claude/skills/sphinx-myst-kb-site/scripts"

[tools]
python = "3.12" # must match python-version in .github/workflows/deploy-doc.yml
uv = "latest"
node = "24.15.0" # exact: must match node-version in .github/workflows/deploy-doc.yml

[tasks.inst-node]
description = "Install the Node CLIs pinned in package-lock.json (pagefind, wrangler) into node_modules/"
run = "npm install --no-audit --no-fund"

[tasks.build-doc]
description = "Build the docs (Sphinx + Pagefind) into docs/build/html/"
depends = ["inst", "inst-node"]
run = "sh .mise/tasks/build-doc.sh" # shared with .github/workflows/deploy-doc.yml

[tasks.view-doc]
description = "(Re)start the docs server on http://localhost:$KB_DOCS_PORT and open it; idempotent; Ctrl+C to stop"
run = """
pids=$(lsof -tiTCP:$KB_DOCS_PORT -sTCP:LISTEN || true)  # lsof exits 1 when the port is free
if [ -n "$pids" ]; then
  echo "Stopping the server on port $KB_DOCS_PORT (pid $pids)"
  kill $pids
  while lsof -tiTCP:$KB_DOCS_PORT -sTCP:LISTEN >/dev/null; do sleep 0.1; done
fi
(sleep 1 && open http://localhost:$KB_DOCS_PORT/) &
exec python3 "$KB_SCRIPTS/serve_docs.py" --port $KB_DOCS_PORT --directory docs/build/html
"""

[tasks.deploy-doc]
description = "Build, create the Cloudflare Pages project if missing, upload docs/build/html"
depends = ["build-doc"]
run = "sh .mise/tasks/deploy-doc.sh" # shared with .github/workflows/deploy-doc.yml

[tasks.setup-cloudflare-secrets]
description = "Set the GitHub Actions secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and variables KB_DOMAIN, KB_SUBDOMAIN (idempotent)"
depends = ["inst"]
run = ".venv/bin/python .mise/tasks/setup-cloudflare-secrets.py"

[tasks.new-doc-id]
description = "Print a new random doc_id"
run = 'python3 "$KB_SCRIPTS/new_doc_id.py"'

[tasks.nb-to-md]
description = "Write a compact Markdown copy of every README.ipynb to docs/build/html/_sources/<path>/README.md; also runs in build-doc"
run = 'python3 "$KB_SCRIPTS/nb_to_md.py"'

[tasks.lint-doc]
description = "Lint every document's metadata; also the first step of build-doc"
run = 'python3 "$KB_SCRIPTS/lint_docs.py"'

[tasks.check-kb-sync]
description = "Check that the site's copies of the skill's example files have not drifted"
run = 'python3 "$KB_SCRIPTS/check_example_sync.py"'
